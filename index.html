<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F2">
<title>Portafoglio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <button class="icon-btn" id="calendarBtn" aria-label="Apri calendario">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><line x1="16" y1="3" x2="16" y2="7"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    </button>
    <div class="title">Portafoglio</div>
    <button class="icon-btn" id="menuBtn" aria-label="Altre opzioni">&#8942;</button>
  </header>

  <section class="balance-card">
    <div class="balance-label">Saldo attuale</div>
    <div class="balance-value" id="balanceValue">€0,00</div>
    <div class="balance-delta" id="balanceDelta"></div>
  </section>

  <div class="period-nav">
    <button id="prevMonth" aria-label="Mese precedente">&#8249;</button>
    <div id="periodLabel">—</div>
    <button id="nextMonth" aria-label="Mese successivo">&#8250;</button>
  </div>

  <section class="charts-row">
    <button class="chart-card income" id="chartCardIncome" type="button" aria-label="Apri dettaglio entrate">
      <div class="chart-title dot-green">Entrate</div>
      <div class="donut-wrap">
        <div class="donut" id="donutIncome"></div>
        <div class="donut-hole">
          <div class="donut-total" id="incomeTotal">€0</div>
          <div class="donut-sub">totale</div>
        </div>
      </div>
      <div class="legend" id="legendIncome"></div>
    </button>
    <button class="chart-card expense" id="chartCardExpense" type="button" aria-label="Apri dettaglio uscite">
      <div class="chart-title dot-red">Uscite</div>
      <div class="donut-wrap">
        <div class="donut" id="donutExpense"></div>
        <div class="donut-hole">
          <div class="donut-total" id="expenseTotal">€0</div>
          <div class="donut-sub">totale</div>
        </div>
      </div>
      <div class="legend" id="legendExpense"></div>
    </button>
  </section>

  <div class="segmented-wrap">
    <div class="segmented" id="segmented">
      <div class="seg-indicator" id="segIndicator"></div>
      <button class="seg-btn" data-type="income">Entrate</button>
      <button class="seg-btn active" data-type="expense">Uscite</button>
    </div>
  </div>

  <section class="list-wrap" id="listWrap"></section>
</div>

<button class="fab" id="fabBtn" aria-label="Aggiungi movimento">+</button>

<div class="fab-panel" id="fabPanel">
  <div class="fab-panel-header">
    <button class="fab-back" id="fabBack" hidden>&#8249;</button>
    <div class="fab-panel-title" id="fabPanelTitle">Aggiungi movimento</div>
  </div>
  <div class="fab-panel-body" id="fabPanelBody"></div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <button id="sheetCancel">Annulla</button>
    <div class="sheet-title" id="sheetTitle"><span class="ic" id="sheetIcon">🍽️</span><span id="sheetCatName">Cibo</span></div>
    <button id="sheetSave" disabled>Salva</button>
  </div>
  <div class="amount-input-wrap">
    <span class="currency">€</span>
    <input type="text" inputmode="decimal" id="amountInput" placeholder="0,00">
  </div>
  <div class="field">
    <label for="noteInput">Nota (opzionale)</label>
    <input type="text" id="noteInput" placeholder="Aggiungi una nota" maxlength="60">
  </div>
  <div class="field">
    <label for="dateInput">Data</label>
    <input type="date" id="dateInput">
  </div>
  <div class="field">
    <label>Carta</label>
    <div class="card-chip-scroll" id="cardChipScroll"></div>
  </div>
  <button class="save-btn" id="saveBtn" disabled>Salva movimento</button>
</div>

<div class="action-sheet" id="deleteSheet">
  <div class="action-sheet-card"><button class="action-danger" id="deleteConfirm">Elimina movimento</button></div>
  <div class="action-sheet-card"><button class="action-cancel" id="deleteCancel">Annulla</button></div>
</div>

<div class="calendar-popup" id="calendarPopup">
  <div class="calendar-header">
    <button id="calPrevMonth" aria-label="Mese precedente">&#8249;</button>
    <div id="calPeriodLabel">—</div>
    <button id="calNextMonth" aria-label="Mese successivo">&#8250;</button>
  </div>
  <div class="calendar-weekdays">
    <span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span>
  </div>
  <div class="calendar-grid" id="calendarGrid"></div>
  <div class="calendar-day-detail" id="calendarDayDetail"></div>
</div>

<div class="dropdown-menu" id="dataMenu">
  <button id="settingsBtn">Impostazioni</button>
  <button id="exportBtn">Esporta dati (JSON)</button>
  <button id="importBtn">Importa dati</button>
  <button class="action-danger" id="resetBtn">Azzera tutti i dati</button>
</div>

<div class="detail-view" id="detailView">
  <div class="detail-header">
    <button class="detail-back" id="detailBack" aria-label="Indietro">&#8249;</button>
    <div class="detail-title" id="detailTitle">Entrate</div>
  </div>
  <div class="detail-period-nav">
    <button id="detailPrevMonth" aria-label="Mese precedente">&#8249;</button>
    <div id="detailPeriodLabel">—</div>
    <button id="detailNextMonth" aria-label="Mese successivo">&#8250;</button>
  </div>
  <div class="detail-chart-card">
    <div class="donut-wrap">
      <div class="donut" id="donutDetail"></div>
      <div class="donut-hole">
        <div class="donut-total" id="detailTotal">€0</div>
        <div class="donut-sub">totale</div>
      </div>
    </div>
    <div class="legend" id="legendDetail"></div>
  </div>
  <div class="detail-list" id="detailList"></div>
</div>

<div class="sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Impostazioni</div>
    <button id="settingsClose">Chiudi</button>
  </div>
  <div class="settings-section-label">Le tue carte</div>
  <div class="cards-list" id="cardsList"></div>
  <div class="add-card-row">
    <input type="text" id="newCardInput" placeholder="Nome carta (es. Visa Revolut)" maxlength="24">
    <button id="addCardBtn">Aggiungi</button>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" hidden>
<div class="scrim" id="scrim"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "portafoglio_transactions_v1";
  var STORAGE_KEY_CARDS = "portafoglio_cards_v1";

  var CATEGORIES = {
    income: [
      {id:"stipendio", name:"Stipendio", icon:"💼", color:"#007AFF"},
      {id:"regalo", name:"Regalo", icon:"🎁", color:"#FF2D55"},
      {id:"rimborso", name:"Rimborso", icon:"🔄", color:"#5AC8FA"},
      {id:"vendita", name:"Vendita", icon:"🏷️", color:"#FF9500"},
      {id:"investimenti", name:"Investimenti", icon:"📈", color:"#AF52DE"},
      {id:"altro_i", name:"Altro", icon:"✨", color:"#8E8E93"}
    ],
    expense: [
      {id:"cibo", name:"Cibo", icon:"🍽️", color:"#FF9500"},
      {id:"trasporti", name:"Trasporti", icon:"🚗", color:"#007AFF"},
      {id:"casa", name:"Casa", icon:"🏠", color:"#5856D6"},
      {id:"bollette", name:"Bollette", icon:"💡", color:"#FFCC00"},
      {id:"svago", name:"Svago", icon:"🎮", color:"#AF52DE"},
      {id:"salute", name:"Salute", icon:"⚕️", color:"#FF2D55"},
      {id:"shopping", name:"Shopping", icon:"🛍️", color:"#5AC8FA"},
      {id:"altro_e", name:"Altro", icon:"✨", color:"#8E8E93"}
    ]
  };

  var MONTHS_IT = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];

  var state = {
    transactions: loadTransactions(),
    segment: "expense",
    period: (function(){ var d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),
    fabStep: 0, // 0 closed, 1 type choice, 2 subcategory choice
    fabType: null,
    pendingType: null,
    pendingCategory: null,
    pendingCard: "Contanti",
    pendingDeleteId: null,
    detailType: null,
    customCards: [],
    calendarSelectedDate: null
  };

  // ---------- persistence ----------
  function loadTransactions(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveTransactions(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.transactions)); }
    catch(e){ /* storage unavailable */ }
  }
  function loadCustomCards(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY_CARDS);
      if(!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveCustomCards(){
    try{ localStorage.setItem(STORAGE_KEY_CARDS, JSON.stringify(state.customCards)); }
    catch(e){ /* storage unavailable */ }
  }
  function allCards(){ return ["Contanti"].concat(state.customCards); }

  // ---------- helpers ----------
  function fmtEUR(n){
    return n.toLocaleString("it-IT", {style:"currency", currency:"EUR"});
  }
  function catById(type, id){
    var list = CATEGORIES[type] || [];
    for(var i=0;i<list.length;i++){ if(list[i].id===id) return list[i]; }
    return null;
  }
  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  function monthTransactions(y, m){
    return state.transactions.filter(function(t){
      var d = new Date(t.date+"T00:00:00");
      return d.getFullYear()===y && d.getMonth()===m;
    });
  }

  // ---------- rendering: balance ----------
  function renderBalance(){
    var total = 0;
    state.transactions.forEach(function(t){
      total += (t.type==="income" ? t.amount : -t.amount);
    });
    document.getElementById("balanceValue").textContent = fmtEUR(total);

    var mtx = monthTransactions(state.period.y, state.period.m);
    var net = 0;
    mtx.forEach(function(t){ net += (t.type==="income" ? t.amount : -t.amount); });
    var label = MONTHS_IT[state.period.m];
    var delta = document.getElementById("balanceDelta");
    if(mtx.length===0){
      delta.textContent = "Nessun movimento a " + label;
      delta.className = "balance-delta";
    } else {
      delta.textContent = (net>=0?"+":"") + fmtEUR(net) + " a " + label;
      delta.className = "balance-delta " + (net>=0 ? "pos" : "neg");
    }
  }

  // ---------- rendering: period ----------
  function renderPeriodLabel(){
    document.getElementById("periodLabel").textContent = MONTHS_IT[state.period.m] + " " + state.period.y;
  }

  // ---------- rendering: donuts ----------
  function paintDonut(type, donutEl, totalEl, legendEl){
    var mtx = monthTransactions(state.period.y, state.period.m).filter(function(t){ return t.type===type; });
    var byCat = {};
    var total = 0;
    mtx.forEach(function(t){
      byCat[t.categoryId] = (byCat[t.categoryId]||0) + t.amount;
      total += t.amount;
    });

    totalEl.textContent = fmtEUR(total).replace(/,00$/,"");
    legendEl.innerHTML = "";

    if(total<=0){
      donutEl.style.background = "#E5E5EA";
      var emptyRow = document.createElement("div");
      emptyRow.className = "legend-empty";
      emptyRow.textContent = "Nessun dato questo mese";
      legendEl.appendChild(emptyRow);
      return;
    }

    var order = CATEGORIES[type];
    var stops = [];
    var cum = 0;
    order.forEach(function(cat){
      var val = byCat[cat.id];
      if(!val) return;
      var pct = val/total*100;
      var start = cum, end = cum+pct;
      stops.push(cat.color+" "+start.toFixed(3)+"% "+end.toFixed(3)+"%");
      cum = end;

      var row = document.createElement("div");
      row.className = "legend-row";
      var dot = document.createElement("span");
      dot.className = "legend-dot";
      dot.style.background = cat.color+"26";
      dot.textContent = cat.icon;
      var name = document.createElement("span");
      name.className = "legend-name";
      name.textContent = cat.name;
      var pctEl = document.createElement("span");
      pctEl.className = "legend-pct";
      pctEl.textContent = Math.round(pct)+"%";
      row.appendChild(dot); row.appendChild(name); row.appendChild(pctEl);
      legendEl.appendChild(row);
    });
    donutEl.style.background = "conic-gradient(" + stops.join(",") + ")";
  }
  function renderDonut(type){
    var donutEl = document.getElementById(type==="income"?"donutIncome":"donutExpense");
    var totalEl = document.getElementById(type==="income"?"incomeTotal":"expenseTotal");
    var legendEl = document.getElementById(type==="income"?"legendIncome":"legendExpense");
    paintDonut(type, donutEl, totalEl, legendEl);
  }

  // ---------- rendering: segmented ----------
  function renderSegmented(){
    var buttons = document.querySelectorAll(".seg-btn");
    buttons.forEach(function(b){ b.classList.toggle("active", b.dataset.type===state.segment); });
    var indicator = document.getElementById("segIndicator");
    indicator.style.transform = state.segment==="expense" ? "translateX(100%)" : "translateX(0)";
  }

  // ---------- rendering: list ----------
  function formatDateHeading(dateStr){
    var d = new Date(dateStr+"T00:00:00");
    var today = new Date(); today.setHours(0,0,0,0);
    var yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
    if(d.getTime()===today.getTime()) return "Oggi";
    if(d.getTime()===yesterday.getTime()) return "Ieri";
    return d.getDate()+" "+MONTHS_IT[d.getMonth()].toLowerCase()+" "+d.getFullYear();
  }

  function renderTxList(type, wrap){
    wrap.innerHTML = "";
    var mtx = monthTransactions(state.period.y, state.period.m)
      .filter(function(t){ return t.type===type; })
      .sort(function(a,b){ return b.date.localeCompare(a.date) || (b.createdAt-a.createdAt); });

    if(mtx.length===0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<span class="emoji">'+(type==="income"?"💸":"🧾")+'</span><span class="msg">Nessuna '+(type==="income"?"entrata":"uscita")+' registrata questo mese</span>';
      wrap.appendChild(empty);
      return;
    }

    var groups = {};
    var order = [];
    mtx.forEach(function(t){
      if(!groups[t.date]){ groups[t.date]=[]; order.push(t.date); }
      groups[t.date].push(t);
    });

    order.forEach(function(dateStr){
      var groupEl = document.createElement("div");
      groupEl.className = "date-group";
      var heading = document.createElement("div");
      heading.className = "date-heading";
      heading.textContent = formatDateHeading(dateStr);
      groupEl.appendChild(heading);

      var card = document.createElement("div");
      card.className = "tx-card";
      groups[dateStr].forEach(function(t){
        var cat = catById(t.type, t.categoryId) || {name:"Altro", icon:"✨", color:"#8E8E93"};
        var row = document.createElement("div");
        row.className = "tx-row";
        row.dataset.id = t.id;
        var subParts = [];
        if(t.card) subParts.push(escapeHtml(t.card));
        if(t.note) subParts.push(escapeHtml(t.note));
        row.innerHTML =
          '<div class="tx-icon" style="background:'+cat.color+'26;">'+cat.icon+'</div>' +
          '<div class="tx-mid"><div class="tx-name">'+escapeHtml(cat.name)+'</div>' +
          (subParts.length ? '<div class="tx-note">'+subParts.join(" · ")+'</div>' : '') + '</div>' +
          '<div class="tx-amount '+t.type+'">'+(t.type==="income"?"+":"-")+fmtEUR(t.amount).replace("€","")+' €</div>';
        row.addEventListener("click", function(){ openDeleteSheet(t.id); });
        card.appendChild(row);
      });
      groupEl.appendChild(card);
      wrap.appendChild(groupEl);
    });
  }
  function renderList(){
    renderTxList(state.segment, document.getElementById("listWrap"));
  }

  function escapeHtml(s){
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function renderAll(){
    renderBalance();
    renderPeriodLabel();
    renderDonut("income");
    renderDonut("expense");
    renderSegmented();
    renderList();
  }

  // ---------- period nav ----------
  document.getElementById("prevMonth").addEventListener("click", function(){
    state.period.m--; if(state.period.m<0){ state.period.m=11; state.period.y--; }
    renderAll();
  });
  document.getElementById("nextMonth").addEventListener("click", function(){
    state.period.m++; if(state.period.m>11){ state.period.m=0; state.period.y++; }
    renderAll();
  });

  // ---------- segmented control ----------
  document.getElementById("segmented").addEventListener("click", function(e){
    var btn = e.target.closest(".seg-btn");
    if(!btn) return;
    state.segment = btn.dataset.type;
    renderSegmented(); renderList();
  });

  // swipe support between segments
  (function(){
    var startX=0, startY=0, tracking=false;
    var area = document.getElementById("listWrap");
    area.addEventListener("touchstart", function(e){
      if(e.touches.length!==1) return;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
    }, {passive:true});
    area.addEventListener("touchend", function(e){
      if(!tracking) return; tracking=false;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){
        state.segment = dx < 0 ? "expense" : "income";
        renderSegmented(); renderList();
      }
    }, {passive:true});
  })();

  // ---------- scrim ----------
  var scrim = document.getElementById("scrim");
  var activeOverlay = null; // 'fab' | 'sheet' | 'delete' | 'data'
  function showScrim(){ scrim.classList.add("show"); }
  function hideScrim(){ scrim.classList.remove("show"); }
  scrim.addEventListener("click", function(){ closeAllOverlays(); });

  function closeAllOverlays(){
    closeFabPanel();
    closeSheet();
    document.getElementById("deleteSheet").classList.remove("show");
    document.getElementById("dataMenu").classList.remove("show");
    document.getElementById("settingsSheet").classList.remove("show");
    document.getElementById("calendarPopup").classList.remove("show");
    hideScrim();
    activeOverlay = null;
  }

  // ---------- FAB panel ----------
  var fabBtn = document.getElementById("fabBtn");
  var fabPanel = document.getElementById("fabPanel");
  var fabBack = document.getElementById("fabBack");
  var fabPanelTitle = document.getElementById("fabPanelTitle");
  var fabPanelBody = document.getElementById("fabPanelBody");

  function openFabPanel(){
    state.fabStep = 1; state.fabType = null;
    renderFabStep();
    fabPanel.classList.add("show");
    fabBtn.classList.add("open");
    showScrim();
    activeOverlay = "fab";
  }
  function closeFabPanel(){
    fabPanel.classList.remove("show");
    fabBtn.classList.remove("open");
    state.fabStep = 0;
  }
  fabBtn.addEventListener("click", function(){
    if(activeOverlay==="fab"){ closeAllOverlays(); }
    else { closeAllOverlays(); openFabPanel(); }
  });
  fabBack.addEventListener("click", function(){
    state.fabStep = 1; state.fabType = null;
    renderFabStep();
  });

  function renderFabStep(){
    fabPanelBody.innerHTML = "";
    if(state.fabStep===1){
      fabBack.hidden = true;
      fabPanelTitle.textContent = "Aggiungi movimento";
      var incBtn = document.createElement("button");
      incBtn.className = "type-choice income";
      incBtn.innerHTML = '<span class="swatch">&#8593;</span><span class="label">Entrata</span>';
      incBtn.addEventListener("click", function(){ state.fabType="income"; state.fabStep=2; renderFabStep(); });
      var expBtn = document.createElement("button");
      expBtn.className = "type-choice expense";
      expBtn.innerHTML = '<span class="swatch">&#8595;</span><span class="label">Uscita</span>';
      expBtn.addEventListener("click", function(){ state.fabType="expense"; state.fabStep=2; renderFabStep(); });
      fabPanelBody.appendChild(incBtn);
      fabPanelBody.appendChild(expBtn);
    } else if(state.fabStep===2){
      fabBack.hidden = false;
      fabPanelTitle.textContent = state.fabType==="income" ? "Categoria entrata" : "Categoria uscita";
      var grid = document.createElement("div");
      grid.className = "subcat-grid";
      CATEGORIES[state.fabType].forEach(function(cat){
        var b = document.createElement("button");
        b.className = "subcat-btn";
        b.innerHTML = '<span class="swatch" style="background:'+cat.color+'22;">'+cat.icon+'</span><span class="label">'+cat.name+'</span>';
        b.addEventListener("click", function(){ openSheetForCategory(state.fabType, cat.id); });
        grid.appendChild(b);
      });
      fabPanelBody.appendChild(grid);
    }
  }

  // ---------- bottom sheet (amount entry) ----------
  var sheet = document.getElementById("sheet");
  var amountInput = document.getElementById("amountInput");
  var noteInput = document.getElementById("noteInput");
  var dateInput = document.getElementById("dateInput");
  var sheetSave = document.getElementById("sheetSave");
  var saveBtn = document.getElementById("saveBtn");
  var sheetIcon = document.getElementById("sheetIcon");
  var sheetCatName = document.getElementById("sheetCatName");

  function refreshCardChips(){
    var container = document.getElementById("cardChipScroll");
    container.innerHTML = "";
    allCards().forEach(function(name){
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "card-chip" + (name===state.pendingCard ? " selected" : "");
      chip.textContent = name;
      chip.addEventListener("click", function(){
        state.pendingCard = name;
        refreshCardChips();
      });
      container.appendChild(chip);
    });
  }

  function openSheetForCategory(type, categoryId){
    closeFabPanel();
    var cat = catById(type, categoryId);
    state.pendingType = type;
    state.pendingCategory = categoryId;
    state.pendingCard = "Contanti";
    sheetIcon.textContent = cat.icon;
    sheetIcon.style.background = cat.color+"22";
    sheetCatName.textContent = cat.name;
    amountInput.value = "";
    noteInput.value = "";
    dateInput.value = todayISO();
    refreshCardChips();
    updateSaveEnabled();
    sheet.classList.add("show");
    showScrim();
    activeOverlay = "sheet";
    setTimeout(function(){ amountInput.focus(); }, 260);
  }
  function closeSheet(){ sheet.classList.remove("show"); }

  document.getElementById("sheetCancel").addEventListener("click", closeAllOverlays);
  amountInput.addEventListener("input", function(){
    var v = amountInput.value.replace(/[^0-9,\.]/g, "");
    var seen = false;
    v = v.split("").filter(function(ch){
      if(ch==="," || ch==="."){ if(seen) return false; seen=true; }
      return true;
    }).join("");
    amountInput.value = v;
    updateSaveEnabled();
  });
  function parsedAmount(){
    var v = amountInput.value.replace(",", ".");
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }
  function updateSaveEnabled(){
    var ok = parsedAmount() > 0;
    sheetSave.disabled = !ok;
    saveBtn.disabled = !ok;
  }
  function commitTransaction(){
    var amount = parsedAmount();
    if(amount<=0) return;
    var tx = {
      id: "t"+Date.now()+Math.random().toString(36).slice(2,7),
      type: state.pendingType,
      categoryId: state.pendingCategory,
      amount: Math.round(amount*100)/100,
      note: noteInput.value.trim(),
      card: state.pendingCard || "Contanti",
      date: dateInput.value || todayISO(),
      createdAt: Date.now()
    };
    state.transactions.push(tx);
    saveTransactions();
    var d = new Date(tx.date+"T00:00:00");
    state.period.y = d.getFullYear(); state.period.m = d.getMonth();
    state.segment = tx.type;
    closeAllOverlays();
    renderAll();
  }
  sheetSave.addEventListener("click", commitTransaction);
  saveBtn.addEventListener("click", commitTransaction);

  // ---------- delete action sheet ----------
  var deleteSheet = document.getElementById("deleteSheet");
  function openDeleteSheet(id){
    state.pendingDeleteId = id;
    deleteSheet.classList.add("show");
    showScrim();
    activeOverlay = "delete";
  }
  document.getElementById("deleteCancel").addEventListener("click", closeAllOverlays);
  document.getElementById("deleteConfirm").addEventListener("click", function(){
    state.transactions = state.transactions.filter(function(t){ return t.id!==state.pendingDeleteId; });
    saveTransactions();
    closeAllOverlays();
    renderAll();
  });

  // ---------- data menu ----------
  var dataMenu = document.getElementById("dataMenu");
  document.getElementById("menuBtn").addEventListener("click", function(){
    if(activeOverlay==="data"){ closeAllOverlays(); return; }
    closeAllOverlays();
    dataMenu.classList.add("show");
    showScrim();
    activeOverlay = "data";
  });

  document.getElementById("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(state.transactions, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "portafoglio-dati.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    closeAllOverlays();
  });

  var importFile = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", function(){
    closeAllOverlays();
    importFile.click();
  });
  importFile.addEventListener("change", function(){
    var file = importFile.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!Array.isArray(data)) throw new Error("formato non valido");
        var valid = data.every(function(t){ return t && t.id && t.type && t.categoryId && typeof t.amount==="number" && t.date; });
        if(!valid) throw new Error("formato non valido");
        state.transactions = data;
        saveTransactions();
        renderAll();
      }catch(e){
        alert("Il file selezionato non è un backup valido.");
      }
      importFile.value = "";
    };
    reader.readAsText(file);
  });

  // ---------- calendar popup ----------
  var calendarPopup = document.getElementById("calendarPopup");
  var WEEKDAY_START_MONDAY = true;
  function firstWeekdayIndex(y, m){
    var d = new Date(y, m, 1).getDay(); // 0=Sun..6=Sat
    return WEEKDAY_START_MONDAY ? (d+6)%7 : d;
  }
  function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
  function dayDotInfo(dateStr){
    var hasIncome=false, hasExpense=false;
    for(var i=0;i<state.transactions.length;i++){
      var t = state.transactions[i];
      if(t.date!==dateStr) continue;
      if(t.type==="income") hasIncome=true; else hasExpense=true;
    }
    if(hasIncome && hasExpense) return "#FF9500";
    if(hasIncome) return "var(--green)";
    if(hasExpense) return "var(--red)";
    return null;
  }
  function renderCalendarDayDetail(dateStr){
    var detail = document.getElementById("calendarDayDetail");
    detail.innerHTML = "";
    if(!dateStr){
      detail.innerHTML = '<div class="cal-detail-empty">Tocca un giorno per vedere i movimenti</div>';
      return;
    }
    var heading = document.createElement("div");
    heading.className = "cal-detail-heading";
    var d = new Date(dateStr+"T00:00:00");
    heading.textContent = d.getDate()+" "+MONTHS_IT[d.getMonth()].toLowerCase()+" "+d.getFullYear();
    detail.appendChild(heading);

    var dayTx = state.transactions.filter(function(t){ return t.date===dateStr; });
    if(dayTx.length===0){
      var empty = document.createElement("div");
      empty.className = "cal-detail-empty";
      empty.textContent = "Nessun movimento in questo giorno";
      detail.appendChild(empty);
      return;
    }
    dayTx.forEach(function(t){
      var cat = catById(t.type, t.categoryId) || {name:"Altro", icon:"✨", color:"#8E8E93"};
      var row = document.createElement("div");
      row.className = "cal-detail-row";
      var subParts = [];
      if(t.card) subParts.push(escapeHtml(t.card));
      if(t.note) subParts.push(escapeHtml(t.note));
      row.innerHTML =
        '<div class="tx-icon" style="width:28px;height:28px;font-size:13px;background:'+cat.color+'26;">'+cat.icon+'</div>' +
        '<div class="tx-mid"><div class="tx-name">'+escapeHtml(cat.name)+'</div>' +
        (subParts.length ? '<div class="tx-note">'+subParts.join(" · ")+'</div>' : '') + '</div>' +
        '<div class="tx-amount '+t.type+'">'+(t.type==="income"?"+":"-")+fmtEUR(t.amount).replace("€","")+' €</div>';
      detail.appendChild(row);
    });
  }
  function renderCalendar(){
    document.getElementById("calPeriodLabel").textContent = MONTHS_IT[state.period.m] + " " + state.period.y;
    var grid = document.getElementById("calendarGrid");
    grid.innerHTML = "";
    var lead = firstWeekdayIndex(state.period.y, state.period.m);
    var total = daysInMonth(state.period.y, state.period.m);
    var todayStr = todayISO();

    for(var i=0;i<lead;i++){
      var blank = document.createElement("div");
      blank.className = "cal-day other-month";
      grid.appendChild(blank);
    }
    for(var day=1; day<=total; day++){
      var mm = String(state.period.m+1).padStart(2,"0");
      var dd = String(day).padStart(2,"0");
      var dateStr = state.period.y+"-"+mm+"-"+dd;
      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cal-day";
      if(dateStr===todayStr) cell.classList.add("today");
      if(dateStr===state.calendarSelectedDate) cell.classList.add("selected");
      var num = document.createElement("span");
      num.className = "cal-day-num";
      num.textContent = day;
      cell.appendChild(num);
      var dotColor = dayDotInfo(dateStr);
      if(dotColor){
        var dot = document.createElement("span");
        dot.className = "cal-dot";
        dot.style.background = dotColor;
        cell.appendChild(dot);
      }
      cell.addEventListener("click", function(){
        var ds = this.dataset.date;
        state.calendarSelectedDate = ds;
        renderCalendar();
        renderCalendarDayDetail(ds);
      });
      cell.dataset.date = dateStr;
      grid.appendChild(cell);
    }
    renderCalendarDayDetail(state.calendarSelectedDate);
  }
  function openCalendar(){
    closeAllOverlays();
    renderCalendar();
    calendarPopup.classList.add("show");
    showScrim();
    activeOverlay = "calendar";
  }
  document.getElementById("calendarBtn").addEventListener("click", function(){
    if(activeOverlay==="calendar"){ closeAllOverlays(); return; }
    openCalendar();
  });
  document.getElementById("calPrevMonth").addEventListener("click", function(){
    state.period.m--; if(state.period.m<0){ state.period.m=11; state.period.y--; }
    state.calendarSelectedDate = null;
    renderCalendar();
  });
  document.getElementById("calNextMonth").addEventListener("click", function(){
    state.period.m++; if(state.period.m>11){ state.period.m=0; state.period.y++; }
    state.calendarSelectedDate = null;
    renderCalendar();
  });

  // ---------- detail view ----------
  var detailView = document.getElementById("detailView");
  function renderDetail(){
    var type = state.detailType;
    document.getElementById("detailTitle").textContent = type==="income" ? "Entrate" : "Uscite";
    document.getElementById("detailPeriodLabel").textContent = MONTHS_IT[state.period.m] + " " + state.period.y;
    paintDonut(type, document.getElementById("donutDetail"), document.getElementById("detailTotal"), document.getElementById("legendDetail"));
    renderTxList(type, document.getElementById("detailList"));
  }
  function openDetailView(type){
    closeAllOverlays();
    state.detailType = type;
    renderDetail();
    detailView.classList.add("show");
  }
  function closeDetailView(){
    detailView.classList.remove("show");
    renderAll();
  }
  document.getElementById("chartCardIncome").addEventListener("click", function(){ openDetailView("income"); });
  document.getElementById("chartCardExpense").addEventListener("click", function(){ openDetailView("expense"); });
  document.getElementById("detailBack").addEventListener("click", closeDetailView);
  document.getElementById("detailPrevMonth").addEventListener("click", function(){
    state.period.m--; if(state.period.m<0){ state.period.m=11; state.period.y--; }
    renderDetail();
  });
  document.getElementById("detailNextMonth").addEventListener("click", function(){
    state.period.m++; if(state.period.m>11){ state.period.m=0; state.period.y++; }
    renderDetail();
  });

  // ---------- settings: manage cards ----------
  var settingsSheet = document.getElementById("settingsSheet");
  function renderCardsList(){
    var list = document.getElementById("cardsList");
    list.innerHTML = "";
    var fixedRow = document.createElement("div");
    fixedRow.className = "card-row";
    fixedRow.innerHTML = '<div class="card-chip-icon">&#128176;</div><div class="card-name">Contanti</div>';
    list.appendChild(fixedRow);
    state.customCards.forEach(function(name, idx){
      var row = document.createElement("div");
      row.className = "card-row";
      row.innerHTML = '<div class="card-chip-icon">&#128179;</div><div class="card-name">'+escapeHtml(name)+'</div>';
      var removeBtn = document.createElement("button");
      removeBtn.className = "card-remove";
      removeBtn.textContent = "\u2715";
      removeBtn.addEventListener("click", function(){
        state.customCards.splice(idx, 1);
        saveCustomCards();
        renderCardsList();
      });
      row.appendChild(removeBtn);
      list.appendChild(row);
    });
  }
  document.getElementById("settingsBtn").addEventListener("click", function(){
    closeAllOverlays();
    renderCardsList();
    settingsSheet.classList.add("show");
    showScrim();
    activeOverlay = "settings";
  });
  document.getElementById("settingsClose").addEventListener("click", closeAllOverlays);
  function addNewCard(){
    var input = document.getElementById("newCardInput");
    var name = input.value.trim();
    if(!name) return;
    if(name.length>24) name = name.slice(0,24);
    if(name.toLowerCase()==="contanti" || state.customCards.indexOf(name)!==-1){
      input.value = "";
      return;
    }
    state.customCards.push(name);
    saveCustomCards();
    input.value = "";
    renderCardsList();
  }
  document.getElementById("addCardBtn").addEventListener("click", addNewCard);
  document.getElementById("newCardInput").addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); addNewCard(); }
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    closeAllOverlays();
    if(confirm("Cancellare definitivamente tutti i movimenti? L'operazione non è reversibile.")){
      state.transactions = [];
      saveTransactions();
      renderAll();
    }
  });

  // ---------- init ----------
  state.customCards = loadCustomCards();
  renderAll();
})();
</script>
</body>
</html>
